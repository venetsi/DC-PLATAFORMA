<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="3600" />
<title>DC-PLATAFORMA — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #10161f;
    --bg-1: #1a2230;
    --bg-2: #222c3d;
    --gold: #c9b086;
    --teal: #3fb6bd;
    --verde: #3fb66a;
    --amarillo: #e0b83f;
    --rojo: #e05c3f;
    --texto: #eef1f5;
    --texto-tenue: #9aa5b4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: radial-gradient(circle at 20% 0%, var(--bg-1), var(--bg-0) 60%);
    color: var(--texto);
    font-family: 'Montserrat', system-ui, sans-serif;
  }
  #app { width: 1920px; height: 1080px; display: flex; flex-direction: column; padding: 32px 48px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .titulo { display: flex; flex-direction: column; }
  .titulo .marca { font-size: 16px; letter-spacing: 3px; color: var(--gold); font-weight: 700; text-transform: uppercase; }
  .titulo .depto { font-size: 38px; font-weight: 800; margin-top: 2px; }

  .header-derecha { display: flex; align-items: center; gap: 28px; }

  .clima { display: flex; align-items: center; gap: 14px; }
  .clima-hora { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .clima-hora img { width: 26px; height: 26px; }
  .clima-hora .h { font-size: 11px; color: var(--texto-tenue); font-weight: 600; }
  .clima-hora .t { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .reloj { text-align: right; }
  .reloj .hora { font-size: 34px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
  .reloj .fecha { font-size: 14px; color: var(--texto-tenue); text-transform: capitalize; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--bg-1); border-radius: 10px; padding: 10px 16px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px; }
  .kpi .valor { font-size: 26px; font-weight: 800; line-height: 1; }
  .kpi .etiqueta { font-size: 12px; color: var(--texto-tenue); text-transform: uppercase; letter-spacing: 0.5px; }
  .semaforo { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 18px 2px currentColor; }
  .semaforo.verde { background: var(--verde); color: var(--verde); }
  .semaforo.amarillo { background: var(--amarillo); color: var(--amarillo); }
  .semaforo.rojo { background: var(--rojo); color: var(--rojo); }
  .valor.verde { color: var(--verde); }
  .valor.amarillo { color: var(--amarillo); }
  .valor.rojo { color: var(--rojo); }

  #semana { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; min-height: 0; }
  .dia-col { background: var(--bg-1); border-radius: 14px; padding: 16px 18px; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .dia-col.hoy { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
  .dia-nombre { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 2px; }
  .dia-fecha { font-size: 12px; color: var(--texto-tenue); margin-bottom: 12px; }
  .dia-contenido { overflow-y: auto; flex: 1; }
  .local-grupo { margin-bottom: 12px; }
  .local-nombre { font-size: 13px; font-weight: 700; color: var(--texto); margin-bottom: 4px; }
  .tarea-bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .tarea-bullets li { font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--texto-tenue); }
  .tarea-bullets li::before { content: '●'; font-size: 8px; }
  .tarea-bullets li.pendiente::before { color: var(--amarillo); }
  .tarea-bullets li.realizada::before { color: var(--verde); }
  .tarea-bullets li.vencida::before { color: var(--rojo); }
  .tarea-bullets li.realizada { color: var(--texto-tenue); text-decoration: line-through; }
  .dia-vacio { font-size: 12px; color: var(--texto-tenue); font-style: italic; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 14px; color: var(--texto-tenue); }
  .estado-conexion { display: flex; align-items: center; gap: 8px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; }
  .punto.ok { background: var(--verde); }
  .punto.mal { background: var(--rojo); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titulo">
      <span class="marca">DC-PLATAFORMA</span>
      <span class="depto" id="nombre-depto">Cargando…</span>
    </div>
    <div class="header-derecha">
      <div class="clima" id="clima"></div>
      <div class="reloj">
        <div class="hora" id="reloj-hora">--:--</div>
        <div class="fecha" id="reloj-fecha"></div>
      </div>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="semaforo" id="semaforo-general"></div><div><div class="valor" id="estado-general-texto" style="font-size:16px">—</div><div class="etiqueta">Estado de hoy</div></div></div>
    <div class="kpi"><div class="valor amarillo" id="kpi-pendientes">0</div><div class="etiqueta">Pendientes hoy</div></div>
    <div class="kpi"><div class="valor verde" id="kpi-realizadas">0</div><div class="etiqueta">Realizadas hoy</div></div>
    <div class="kpi"><div class="valor rojo" id="kpi-vencidas">0</div><div class="etiqueta">Vencidas hoy</div></div>
  </div>

  <div id="semana"></div>

  <footer>
    <div class="estado-conexion">
      <span class="punto ok" id="punto-conexion"></span>
      <span id="texto-conexion">Conectando…</span>
    </div>
    <span id="ultima-actualizacion"></span>
  </footer>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var departamento = params.get('depto');
  var key = params.get('key');
  var apiBase = params.get('api') || '/api';
  var CACHE_KEY = 'dcplataforma_tv_' + departamento;

  var REFRESH_MS = 2 * 60 * 1000;
  var RETRY_MS = 30 * 1000;
  var CLIMA_REFRESH_MS = 30 * 60 * 1000; // el clima cambia mucho mas lento -- ciclo propio, independiente

  var DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie'];

  document.getElementById('nombre-depto').textContent = departamento || '(sin departamento)';

  function actualizarReloj() {
    var ahora = new Date();
    document.getElementById('reloj-hora').textContent =
      String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
    document.getElementById('reloj-fecha').textContent =
      ahora.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  actualizarReloj();
  setInterval(actualizarReloj, 1000 * 15);

  function lunesDeEstaSemana() {
    var hoy = new Date();
    var diaIso = hoy.getDay() === 0 ? 7 : hoy.getDay();
    var lunes = new Date(hoy);
    lunes.setDate(hoy.getDate() - (diaIso - 1));
    lunes.setHours(0, 0, 0, 0);
    return lunes;
  }

  function construirColumnasVacias() {
    var lunes = lunesDeEstaSemana();
    var hoyStr = new Date().toDateString();
    var cols = [];
    for (var i = 0; i < 5; i++) {
      var fecha = new Date(lunes);
      fecha.setDate(lunes.getDate() + i);
      cols.push({ nombre: DIAS[i], fecha: fecha, esHoy: fecha.toDateString() === hoyStr, grupos: {} });
    }
    return cols;
  }

  function pintarSemana(eventos) {
    var columnas = construirColumnasVacias();
    var porFecha = {};
    columnas.forEach(function (c) { porFecha[c.fecha.toDateString()] = c; });

    (eventos || []).forEach(function (ev) {
      var fechaEv = new Date(ev.inicio + 'T00:00:00');
      var col = porFecha[fechaEv.toDateString()];
      if (!col) return; // fuera de lunes-viernes (no deberia pasar, el backend ya filtra)
      var local = ev.nombre_local || 'Toda la empresa';
      col.grupos[local] = col.grupos[local] || [];
      col.grupos[local].push(ev);
    });

    var html = columnas.map(function (col) {
      var gruposHtml = Object.keys(col.grupos).sort().map(function (local) {
        var itemsHtml = col.grupos[local].map(function (ev) {
          return '<li class="' + ev.estado + '">' + ev.titulo + '</li>';
        }).join('');
        return '<div class="local-grupo"><div class="local-nombre">' + local + '</div><ul class="tarea-bullets">' + itemsHtml + '</ul></div>';
      }).join('');
      return '<div class="dia-col' + (col.esHoy ? ' hoy' : '') + '">'
        + '<div class="dia-nombre">' + col.nombre + '</div>'
        + '<div class="dia-fecha">' + col.fecha.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) + '</div>'
        + '<div class="dia-contenido">' + (gruposHtml || '<div class="dia-vacio">Sin tareas</div>') + '</div>'
        + '</div>';
    }).join('');

    document.getElementById('semana').innerHTML = html;
  }

  function pintar(data) {
    document.getElementById('nombre-depto').textContent = data.departamento.nombre;
    document.getElementById('kpi-pendientes').textContent = data.totales.pendientes;
    document.getElementById('kpi-realizadas').textContent = data.totales.realizadas;
    document.getElementById('kpi-vencidas').textContent = data.totales.vencidas;

    var semaforo = document.getElementById('semaforo-general');
    semaforo.className = 'semaforo ' + data.estado_general;
    var textoEstado = { verde: 'Todo al día', amarillo: 'Con pendientes', rojo: 'Con vencidas' }[data.estado_general] || '—';
    document.getElementById('estado-general-texto').textContent = textoEstado;

    pintarSemana(data.eventos);
  }

  function pintarClima(data) {
    var html = (data.horas || []).map(function (h) {
      return '<div class="clima-hora">'
        + (h.icono ? '<img src="' + h.icono + '" alt="' + h.descripcion + '">' : '')
        + '<span class="t">' + (h.temperatura != null ? h.temperatura + '°' : '—') + '</span>'
        + '<span class="h">' + String(h.hora).padStart(2, '0') + 'h</span>'
        + '</div>';
    }).join('');
    document.getElementById('clima').innerHTML = html;
  }

  function marcarConexion(ok, mensaje) {
    document.getElementById('punto-conexion').className = 'punto ' + (ok ? 'ok' : 'mal');
    document.getElementById('texto-conexion').textContent = mensaje;
  }

  function guardarCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data: data, en: Date.now() })); } catch (e) {}
  }
  function leerCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
  }

  function tick() {
    if (!departamento || !key) {
      marcarConexion(false, 'Falta ?depto= y ?key= en la URL');
      return;
    }
    fetch(apiBase + '/tv/resumen?departamento=' + encodeURIComponent(departamento) + '&key=' + encodeURIComponent(key))
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        pintar(data);
        guardarCache(data);
        marcarConexion(true, 'En línea');
        document.getElementById('ultima-actualizacion').textContent =
          'Actualizado ' + new Date(data.actualizado).toLocaleTimeString('es-AR');
        scheduleNext(REFRESH_MS);
      })
      .catch(function () {
        var cache = leerCache();
        if (cache) {
          pintar(cache.data);
          var minutos = Math.round((Date.now() - cache.en) / 60000);
          marcarConexion(false, 'Sin conexión — mostrando datos de hace ' + minutos + ' min');
        } else {
          marcarConexion(false, 'Sin conexión — sin datos en caché todavía');
        }
        scheduleNext(RETRY_MS);
      });
  }

  // Clima: ciclo independiente -- si falla, no debe tocar el resto de la pantalla.
  function tickClima() {
    fetch(apiBase + '/tv/clima')
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(pintarClima)
      .catch(function (err) { console.error('[dc-plataforma-tv] clima fallo', err); });
  }

  var timer;
  function scheduleNext(ms) {
    clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  var cacheInicial = leerCache();
  if (cacheInicial) pintar(cacheInicial.data);

  tick();
  tickClima();
  setInterval(tickClima, CLIMA_REFRESH_MS);
  window.addEventListener('online', tick);

  // Doble red de recarga (ver dashboard-rendimiento-general: quedo 74hs sin
  // actualizar por un bug de refresco silencioso).
  setInterval(function () { location.reload(); }, 60 * 60 * 1000);
})();
</script>
</body>
</html>
